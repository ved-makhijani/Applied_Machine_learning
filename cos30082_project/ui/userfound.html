<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Verified</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6 font-sans">

    <div class="bg-slate-900 border border-emerald-500/30 max-w-xl w-full rounded-2xl p-8 shadow-2xl shadow-emerald-950/20 text-center flex flex-col items-center gap-6 relative overflow-hidden">
        
        <div class="absolute top-0 inset-x-0 h-2 bg-gradient-to-r from-emerald-500 via-teal-400 to-emerald-600"></div>

        <div class="w-20 h-20 bg-emerald-950 border-2 border-emerald-500 text-emerald-400 rounded-full flex items-center justify-center shadow-lg shadow-emerald-900/30 mt-4">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>

        <div>
            <span class="text-xs font-bold uppercase tracking-widest text-emerald-400 px-3 py-1 bg-emerald-950 rounded-full border border-emerald-800">Attendance Logged</span>
            <h1 id="user-name" class="text-3xl font-black text-white mt-4 tracking-tight">Loading Profile...</h1>
            <p id="user-id" class="text-slate-400 font-medium text-sm mt-1">ID: --</p>
        </div>

        <div class="grid grid-cols-2 gap-4 w-full border-t border-b border-slate-800 py-5 my-2">
            <div class="text-left bg-slate-950/60 p-3 rounded-xl border border-slate-800/80">
                <span class="block text-[10px] uppercase tracking-wider text-slate-500 font-bold">Verification Lock</span>
                <span id="user-time" class="text-sm font-semibold font-mono text-slate-200 block mt-1">--</span>
            </div>
            <div class="text-left bg-slate-950/60 p-3 rounded-xl border border-slate-800/80">
                <span class="block text-[10px] uppercase tracking-wider text-slate-500 font-bold">Workplace Emotion</span> [cite: 83]
                <span id="user-emotion" class="text-sm font-semibold text-slate-200 block mt-1">--</span> [cite: 82]
            </div>
        </div>

        <div class="w-full flex flex-col gap-3">
            <a href="index.html" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 py-3 rounded-xl text-sm font-medium transition shadow-md">
                Return to Scanning Station Manually
            </a>
            <p class="text-xs text-slate-500">
                Terminal will auto-reset in <span id="countdown-timer" class="font-bold text-slate-400">5</span> seconds...
            </p>
        </div>
    </div>

    <script>
        // Extract session data passed from index.html dashboard
        const sessionPayload = sessionStorage.getItem("recognizedUser");

        if (sessionPayload) {
            const data = JSON.parse(sessionPayload);
            
            // Map parameters into place
            document.getElementById('user-name').innerText = data.name;
            document.getElementById('user-id').innerText = `Employee ID: ${data.employee_id}`;
            document.getElementById('user-time').innerText = data.timestamp;
            document.getElementById('user-emotion').innerText = `${data.emotion_icon} ${data.emotion_label}`;
        } else {
            // Fallback safety catch if no data is present
            document.getElementById('user-name').innerText = "System Authorization Error";
            document.getElementById('user-id').innerText = "No session metrics parsed.";
        }

        // Auto redirect timer execution loop
        let secondsLeft = 5;
        const countdownDisplay = document.getElementById('countdown-timer');
        
        const countdownInterval = setInterval(() => {
            secondsLeft--;
            countdownDisplay.innerText = secondsLeft;
            
            if (secondsLeft <= 0) {
                clearInterval(countdownInterval);
                // Clear state memory footprint before recycling screen viewports
                sessionStorage.removeItem("recognizedUser");
                window.location.href = "index.html";
            }
        }, 1000);
    </script>
</body>
</html>
